<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset password - AnyTransport</title>
    <link rel="stylesheet" href="css/style.css?v=20260602-1">
    <link rel="stylesheet" href="css/navbar.css?v=20260522-1">
    <link rel="stylesheet" href="css/responsive.css?v=20260529-1">
    <style>
        .reset-wrap {
            max-width: 480px;
            margin: 48px auto 64px;
            padding: 0 16px;
        }
        .reset-card {
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 28px 24px;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
        }
        .reset-card h1 {
            margin: 0 0 8px;
            font-size: 1.5rem;
        }
        .reset-card p {
            margin: 0 0 20px;
            color: #475569;
            line-height: 1.5;
        }
        .reset-status {
            margin: 0 0 16px;
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 0.95rem;
        }
        .reset-status--error {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #991b1b;
        }
        .reset-status--ok {
            background: #ecfdf5;
            border: 1px solid #a7f3d0;
            color: #065f46;
        }
        .reset-actions {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-container">
            <a class="navbar-logo" href="index.html" aria-label="AnyTransport home">
                <img src="assets/logo.jpeg" alt="AnyTransport Logo" class="logo-img">
                <span class="logo-text">AnyTransport</span>
            </a>
            <div class="navbar-right">
                <a href="index.html" class="btn btn-outline">Home</a>
            </div>
        </div>
    </nav>

    <main class="reset-wrap">
        <div class="reset-card">
            <h1>Reset your password</h1>
            <p id="reset-intro">Choose a new password for your AnyTransport account.</p>
            <div id="reset-status" class="reset-status reset-status--error" hidden role="alert"></div>

            <form id="reset-password-form" novalidate>
                <div class="form-group">
                    <label for="reset-password">New password</label>
                    <div style="display: flex; gap: 8px; align-items: stretch;">
                        <input type="password" id="reset-password" class="form-input" required minlength="6" autocomplete="new-password" placeholder="At least 6 characters" style="flex: 1;">
                        <button type="button" style="padding: 8px 12px; background: #e8f0fe; border: 1px solid #cce5ff; border-radius: 4px; cursor: pointer; white-space: nowrap;" onclick="togglePasswordVisibility(this)">Show</button>
                    </div>
                </div>
                <div class="form-group">
                    <label for="reset-password-confirm">Confirm new password</label>
                    <input type="password" id="reset-password-confirm" class="form-input" required minlength="6" autocomplete="new-password" placeholder="Repeat your new password">
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%;" id="reset-submit-btn">Update password</button>
            </form>

            <div class="reset-actions">
                <a href="index.html" class="btn btn-outline" id="reset-back-login">Back to login</a>
            </div>
        </div>
    </main>

    <script src="js/auth.js?v=20260609-8"></script>
    <script src="js/reset-password.js?v=20260609-2"></script>
</body>
</html>
