<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages - AnyTransport</title>
    <link rel="stylesheet" href="css/style.css?v=20260322-1">
    <link rel="stylesheet" href="css/navbar.css?v=20260420-4">
    <style>
        .messages-wrap { max-width: 1000px; margin: 0 auto; padding: 24px 16px 40px; }
        .messages-head { margin-bottom: 16px; }
        .messages-head h1 { margin: 0 0 8px; }
        .messages-head p { margin: 0; color: #475569; }
        .messages-bid-context { border: 1px solid #dbeafe; background: #eff6ff; border-radius: 10px; padding: 12px 14px; margin-bottom: 14px; }
        .messages-bid-context h3 { margin: 0 0 6px; font-size: 14px; color: #1d4ed8; }
        .messages-bid-context p { margin: 0; color: #1e293b; }
        .messages-thread { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 14px; min-height: 260px; max-height: 52vh; overflow-y: auto; }
        .messages-empty { color: #64748b; font-size: 14px; margin: 0; }
        .msg-row { margin: 0 0 10px; display: flex; }
        .msg-row--out { justify-content: flex-end; }
        .msg-bubble { max-width: 75%; border-radius: 10px; padding: 10px 12px; border: 1px solid #cbd5e1; background: #f8fafc; }
        .msg-row--out .msg-bubble { background: #0ea5e9; color: #fff; border-color: #0284c7; }
        .msg-meta { display: block; font-size: 11px; opacity: 0.8; margin-bottom: 4px; }
        .msg-text { margin: 0; white-space: pre-wrap; }
        .messages-composer { margin-top: 14px; display: grid; gap: 8px; }
        .messages-composer input, .messages-composer textarea {
            width: 100%;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            padding: 10px;
            font: inherit;
        }
        .messages-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .messages-status { font-size: 13px; color: #334155; flex: 1 1 100%; }
        .messages-status--warning { color: #b45309; font-weight: 600; }
        .messages-status--ok { color: #047857; }
        .messages-composer .messages-input--warning {
            border-color: #f59e0b;
            box-shadow: 0 0 0 2px rgba(245, 158, 11, 0.2);
        }
        .messages-flag-preview {
            display: none;
        }
        .messages-inline-highlight {
            position: relative;
            width: 100%;
            background: #fff;
            border-radius: 8px;
        }
        .messages-inline-backdrop {
            position: absolute;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            border-radius: 8px;
            z-index: 0;
            visibility: hidden;
        }
        .messages-inline-highlight--active .messages-inline-backdrop {
            visibility: visible;
        }
        .messages-inline-backdrop-content {
            box-sizing: border-box;
            min-height: 100%;
            white-space: pre-wrap;
            word-wrap: break-word;
            overflow-wrap: break-word;
            color: #0f172a;
        }
        .messages-inline-highlight--active:has(> input) .messages-inline-backdrop-content {
            white-space: pre;
        }
        .messages-inline-highlight > textarea,
        .messages-inline-highlight > input {
            position: relative;
            z-index: 1;
            display: block;
            width: 100%;
            background: #fff;
        }
        .messages-inline-highlight--active > .messages-input--mirrored {
            background: transparent !important;
            color: transparent !important;
            -webkit-text-fill-color: transparent;
            caret-color: #0f172a;
        }
        .messages-flagged-text {
            background: rgba(245, 158, 11, 0.55);
            color: #7c2d12;
            border-radius: 2px;
            box-decoration-break: clone;
            -webkit-box-decoration-break: clone;
        }
    </style>
</head>
<body data-navbar-return="true">
    <div id="site-navbar-mount" data-return="true"></div>

    <main class="messages-wrap">
        <header class="messages-head">
            <h1>Messages</h1>
            <p id="messages-subtitle">Chat with your provider.</p>
        </header>

        <section id="messages-bid-context" class="messages-bid-context" style="display:none;">
            <h3>Started from a bid</h3>
            <p id="messages-bid-text"></p>
        </section>

        <section id="messages-thread" class="messages-thread" aria-live="polite">
            <p class="messages-empty">Loading conversation...</p>
        </section>

        <form id="messages-form" class="messages-composer">
            <input id="messages-title" type="text" maxlength="120" placeholder="Subject (optional)" spellcheck="true">
            <div id="messages-title-flag-preview" class="messages-flag-preview" hidden aria-live="polite">
                <p class="messages-flag-preview-label">Flagged text in subject:</p>
                <div class="messages-flag-preview-body"></div>
            </div>
            <textarea id="messages-text" rows="5" maxlength="2000" placeholder="Write your message" spellcheck="true"></textarea>
            <div id="messages-flag-preview" class="messages-flag-preview" hidden aria-live="polite">
                <p class="messages-flag-preview-label">Flagged text in your message (remove or edit to send):</p>
                <div class="messages-flag-preview-body"></div>
            </div>
            <div class="messages-actions">
                <button class="btn btn-primary" type="submit">Send message</button>
                <span id="messages-status" class="messages-status"></span>
            </div>
        </form>
    </main>

    <script src="js/auth.js?v=20260503-7"></script>
    <script src="js/notifications.js?v=20260420-4"></script>
    <script src="js/site-navbar.js?v=20260519-1"></script>
    <script src="js/messages.js?v=20260519-4"></script>
</body>
</html>
