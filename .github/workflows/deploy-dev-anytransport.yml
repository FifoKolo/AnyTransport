name: Deploy Dev (Hetzner)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-dev-anytransport
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: development
    env:
      HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
      HETZNER_USER: ${{ secrets.HETZNER_USER }}
      HETZNER_DEV_PATH: ${{ secrets.HETZNER_DEV_PATH }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HETZNER_SSH_KEY }}

      - name: Validate deploy variables
        run: |
          RAW_HOST="${HETZNER_HOST}"
          RAW_USER="${HETZNER_USER}"
          RAW_PATH="${HETZNER_DEV_PATH}"

          # Accept either plain values or accidental "KEY=value" formatting.
          RAW_HOST="${RAW_HOST#*=}"
          RAW_USER="${RAW_USER#*=}"
          RAW_PATH="${RAW_PATH#*=}"

          CLEAN_HOST="$(printf '%s' "${RAW_HOST}" | tr -d '\r' | xargs)"
          CLEAN_USER="$(printf '%s' "${RAW_USER}" | tr -d '\r' | xargs)"
          CLEAN_PATH="$(printf '%s' "${RAW_PATH}" | tr -d '\r' | xargs)"

          if [ -z "${CLEAN_HOST}" ]; then
            echo "HETZNER_HOST is empty; using fallback 77.42.30.113"
            CLEAN_HOST="77.42.30.113"
          fi
          if [ -z "${CLEAN_USER}" ]; then
            echo "Missing required secret: HETZNER_USER"
            exit 1
          fi
          if [ -z "${CLEAN_PATH}" ]; then
            echo "Missing required secret: HETZNER_DEV_PATH"
            exit 1
          fi

          if ! printf '%s' "${CLEAN_HOST}" | grep -Eq '^[A-Za-z0-9.-]+$'; then
            echo "Invalid HETZNER_HOST value after cleanup: ${CLEAN_HOST}"
            echo "Expected example: 77.42.30.113"
            exit 1
          fi

          echo "HETZNER_HOST=${CLEAN_HOST}" >> "$GITHUB_ENV"
          echo "HETZNER_USER=${CLEAN_USER}" >> "$GITHUB_ENV"
          echo "HETZNER_DEV_PATH=${CLEAN_PATH}" >> "$GITHUB_ENV"

      - name: Add server host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${HETZNER_HOST}" >> ~/.ssh/known_hosts

      - name: Preflight on server (SSH + rsync + path)
        run: |
          ssh "${HETZNER_USER}@${HETZNER_HOST}" "bash -lc '
            set -e
            if ! command -v rsync >/dev/null 2>&1; then
              apt-get update
              apt-get install -y rsync
            fi
            mkdir -p \"${HETZNER_DEV_PATH}\"
          '"

      - name: Sync files to dev server
        run: |
          rsync -az --delete \
            --exclude ".git" \
            --exclude ".github" \
            --exclude "node_modules" \
            --exclude ".env" \
            --exclude "api/.env" \
            ./ "${HETZNER_USER}@${HETZNER_HOST}:${HETZNER_DEV_PATH}/"

      - name: Post-deploy checks and service reload
        run: |
          ssh "${HETZNER_USER}@${HETZNER_HOST}" "bash -lc '
            set -e
            cd \"${HETZNER_DEV_PATH}\"
            if [ -f composer.json ]; then
              composer install --no-interaction --no-dev --prefer-dist
            fi
            nginx -t
            systemctl reload nginx
            if systemctl list-unit-files | grep -q \"^php8.3-fpm\"; then
              systemctl reload php8.2-fpm || true
            fi
          '"

      - name: Health check (dev)
        run: |
          curl -fsS "https://dev.anytransport.ie/" > /dev/null
