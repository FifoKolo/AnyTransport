<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>My Dashboard - AnyTransport</title>
    <link rel="stylesheet" href="css/style.css?v=20260322-1">
    <link rel="stylesheet" href="css/navbar.css?v=20260322-1">
    <link rel="stylesheet" href="css/dashboard.css?v=20260322-1">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="navbar-container">
            <a class="navbar-logo" href="index.html" aria-label="Go to landing page">
                <img src="assets/logo.jpeg" alt="AnyTransport Logo" class="logo-img">
                <span class="logo-text">AnyTransport</span>
            </a>
            <div class="navbar-menu">
                <a href="index.html#about" class="nav-link">About Us</a>
                <a href="index.html#services" class="nav-link">Our Services</a>
                <a href="index.html#how-it-works" class="nav-link">How it Works</a>
                <a href="index.html#pricing" class="nav-link">Pricing</a>
                <a href="index.html#faq" class="nav-link">FAQ</a>
                <a href="index.html#contact" class="nav-link">Contact Us</a>
            </div>
            <div class="navbar-right">
                <!-- Auth menu (shown when NOT logged in) -->
                <div id="auth-menu" style="display: flex;">
                    <button class="btn btn-outline" onclick="openLoginModal()">Login</button>
                </div>
                <!-- User menu (shown when logged in) -->
                <div id="user-menu" style="display: none;">
                    <a href="dashboard.html" style="text-decoration: none;">
                        <div class="navbar-avatar" id="navbar-user-avatar">U</div>
                    </a>
                    <button class="btn btn-primary" onclick="logout()" style="margin-left: 10px;">Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="container dashboard-container">
        <!-- Sidebar -->
        <aside class="dashboard-sidebar">
            <div class="user-info">
                <div class="user-avatar" id="user-avatar">U</div>
                <h3 id="user-name">User Name</h3>
                <p id="user-email">user@example.com</p>
            </div>

            <nav class="dashboard-nav">
                <a href="#" class="nav-item active" data-tab="my-quotes">My Quotes</a>
                <a href="#" class="nav-item" data-tab="profile">Profile Settings</a>
            </nav>
        </aside>

        <!-- Main Content -->
        <section class="dashboard-content">
            <!-- My Quotes Tab -->
            <div id="my-quotes" class="tab-content active">
                <div class="tab-header">
                    <h2>My Quote Requests</h2>
                    <a href="index.html" class="btn btn-primary">Get a Quote</a>
                </div>
                <div id="my-quotes-list" class="quotes-list">
                    <!-- Quote requests will be loaded here -->
                </div>
                </div>
            </div>

            <!-- Profile Settings Tab -->
            <div id="profile" class="tab-content">
                <h2>Profile Settings</h2>
                <form id="profile-form" class="profile-form">
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" id="profile-name" required>
                    </div>

                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="profile-email" required>
                    </div>

                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </form>
            </div>
        </section>
    </main>

    <script src="js/cache-maintenance.js?v=20260322-2"></script>
    <script src="js/auth.js?v=20260409-3"></script>
    <script src="js/dashboard-fixed.js?v=20260322-1"></script>
</body>
</html>
