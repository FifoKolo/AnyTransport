name: Deploy Dev (Hetzner)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-dev-anytransport
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: development
    env:
      HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
      HETZNER_USER: ${{ secrets.HETZNER_USER }}
      HETZNER_DEV_PATH: ${{ secrets.HETZNER_DEV_PATH }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HETZNER_SSH_KEY }}

      - name: Validate deploy variables
        run: |
          if [ -z "${HETZNER_HOST}" ]; then
            echo "HETZNER_HOST is empty; using fallback 77.42.30.113"
            echo "HETZNER_HOST=77.42.30.113" >> "$GITHUB_ENV"
          fi
          if [ -z "${HETZNER_USER}" ]; then
            echo "Missing required secret: HETZNER_USER"
            exit 1
          fi
          if [ -z "${HETZNER_DEV_PATH}" ]; then
            echo "Missing required secret: HETZNER_DEV_PATH"
            exit 1
          fi

      - name: Add server host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${HETZNER_HOST}" >> ~/.ssh/known_hosts

      - name: Sync files to dev server
        run: |
          rsync -az --delete \
            --exclude ".git" \
            --exclude ".github" \
            --exclude "node_modules" \
            --exclude ".env" \
            --exclude "api/.env" \
            ./ "${HETZNER_USER}@${HETZNER_HOST}:${HETZNER_DEV_PATH}/"

      - name: Post-deploy checks and service reload
        run: |
          ssh "${HETZNER_USER}@${HETZNER_HOST}" "bash -lc '
            set -e
            cd \"${HETZNER_DEV_PATH}\"
            if [ -f composer.json ]; then
              composer install --no-interaction --no-dev --prefer-dist
            fi
            nginx -t
            systemctl reload nginx
            if systemctl list-unit-files | grep -q \"^php8.2-fpm\"; then
              systemctl reload php8.2-fpm || true
            fi
          '"

      - name: Health check (dev)
        run: |
          curl -fsS "https://dev.anytransport.ie/" > /dev/null
